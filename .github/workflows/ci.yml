name: ci
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm install
      - name: lint
        run: npm run -s lint --if-present
      - name: typecheck
        run: npm run -s typecheck --if-present
      - name: test
        run: npm run -s test --if-present
